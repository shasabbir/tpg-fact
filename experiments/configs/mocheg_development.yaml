study:
  name: cefes-mocheg
  phase: development
  formal_test_locked: true
  seeds: [13, 37, 73]
  maximum_configuration_trials: 20

dataset:
  name: MOCHEG
  license: CC-BY-4.0
  train_revision: 985e4206cf9990ff0a875473616be204cfbd09c3
  validation_revision: 9dabf73ad41ddecafb3b525fb82a3de018e3e378
  shared_corpus_revision: d9b15bf2b7d2be790c40efa960e8f05a58487ce2
  sealed_test_revision: a72342a67b6bb5e930f8a2aa5fc3b051690c0f74
  test_annotations_allowed: false
  evidence_unit: modality_qualified_qrel_document_id
  duplicate_qrel_policy: collapse_identical_reject_conflicting
  selector_training_without_candidates: exclude

candidates:
  maximum_text_items: 40
  maximum_image_items: 20
  shared_across_selectors: true
  text_retrieval: bge_then_rerank
  image_retrieval: siglip_then_rerank
  ranking_frozen_before_selector_comparison: true

encoders:
  text_model: BAAI/bge-m3
  text_revision: 5617a9f61b028005a4858fdac845db406aefb181
  vision_model: google/siglip2-base-patch16-224
  vision_revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
  precision: mixed_float16
  feature_cache_required: true

selection:
  method: calibrated_exact_expected_set_f1
  empty_selection_allowed: false
  tie_break: smaller_set
  calibration: binary_temperature_scaling
  calibration_fit_partition: claim_grouped_training_fold
  fixed_budgets: [1, 2, 3, 5, 10, 20, 40, 60]
  maximum_selected_items: 60

development_gate:
  mean_evidence_f1_gain_over_best_fixed: 0.015
  positive_effect_required_each_seed: true
  maximum_verdict_macro_f1_decline: 0.01
  calibrated_brier_must_not_worsen: true
  clean_rerun_required: true

evaluation:
  primary: claim_macro_evidence_set_f1
  secondary:
    - verdict_macro_f1
    - evidence_precision
    - evidence_recall
    - evidence_exact_match
    - evidence_jaccard
    - brier
    - nll
    - ece
  bootstrap_samples: 10000
  confidence_level: 0.95
  multiplicity: holm
