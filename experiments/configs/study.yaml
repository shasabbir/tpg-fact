study:
  name: trace-scv
  task: evidence_traceable_multimodal_claim_verification
  seeds: [13, 37, 73, 101, 137]

datasets:
  primary: sciver
  external_scientific: musciclaims
  external_general: mocheg
  optional: aichartclaim

model:
  backbone: Qwen/Qwen2.5-VL-3B-Instruct
  quantization_bits: 4
  use_lora: true
  maximum_evidence_items: 12
  citation_budget: 4
  selector: straight_through_topk

loss:
  verdict: 1.0
  evidence_selection: 0.5
  explanation: 0.5
  sparsity: 0.05
  decisive_deletion: 0.3
  irrelevant_invariance: 0.2
  duplicate_invariance: 0.2
  modality_swap: 0.2

evaluation:
  bootstrap_samples: 10000
  confidence_level: 0.95
  multiplicity: holm
  verdict_drop_tolerance_points: 1.0
